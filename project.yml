name: LiveUp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.2.2

targets:
  LiveUp:
    type: application
    platform: iOS
    sources:
      - path: LiveUp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LiveUp
        PRODUCT_NAME: LiveUp
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LiveUp/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiveUp/LiveUp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LiveUp
    dependencies:
      - target: LiveUpWidget
        embed: true

  LiveUpWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveUpWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LiveUp.Widget
        PRODUCT_NAME: LiveUpWidget
        INFOPLIST_FILE: LiveUpWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiveUpWidget/LiveUpWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  LiveUp:
    build:
      targets:
        LiveUp: all
        LiveUpWidget: all
    run:
      config: Release
    archive:
      config: Release
